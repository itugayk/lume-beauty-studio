server {
    listen       80;
    server_name  guzellik.demo.dijifa.com;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff font/woff2;

    # güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # statik varlıklar — uzun önbellek (Astro hash'li dosyalar)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Astro statik çıktısı: doğrudan dosya, sonra .html, sonra 404
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # özel 404 sayfası
    error_page 404 /404.html;
}
